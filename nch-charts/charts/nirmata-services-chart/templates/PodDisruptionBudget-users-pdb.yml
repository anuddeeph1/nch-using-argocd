{{- if .Values.users.enabled }}
---
apiVersion: "policy/v1"
kind: "PodDisruptionBudget"
metadata:
  name: "users-pdb"
  namespace: {{ include "helmchart.namespace" . | quote }}
  labels: {}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      nirmata.io/service.name: "users"
    matchExpressions: []
{{- end }}
