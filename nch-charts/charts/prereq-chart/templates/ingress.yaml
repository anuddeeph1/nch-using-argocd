{{- if and .Values.ingress .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: azure/application-gateway # < add annotation indicating the ingress to use.
    cert-manager.io/cluster-issuer: letsencrypt-prod-issuer     # < add annotation indicating the cert issuer to use.
    appgw.ingress.kubernetes.io/ssl-redirect: "true"       # < add annotation to redirect 80 requests to 443.
    cert-manager.io/acme-challenge-type: http01          # < this is no longer required; works without it.
    appgw.ingress.kubernetes.io/backend-protocol: https
    appgw.ingress.kubernetes.io/health-probe-port: "8443"
    appgw.ingress.kubernetes.io/health-probe-path: "/security/login.html"
  name: nirmata-ingress
  namespace: {{ include "helmchart.namespace" . | quote }}
spec:
  rules:
  - host: {{ .Values.global.product.url }}
    http:
      paths:
      - backend:
          service:
            name: haproxy
            port:
              number: 443
        path: /
        pathType: Prefix
  tls:
  - hosts:
    -  {{ .Values.global.product.url }}
    secretName: tls-certificate
{{- end }}
