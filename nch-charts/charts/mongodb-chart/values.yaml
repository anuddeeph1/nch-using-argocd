# Default values for mongodb-services.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates while testing mongodb solo.

replicaCount: 1

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

mongodbAgentUbi:
  image:
    name: mongodb-agent-ubi
    tag: 108.0.4.8770-1
    pullPolicy: IfNotPresent

mongodbKubernetesOperator:
  image:
    name: mongodb-kubernetes-operator
    tag: 0.13.0
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 1100m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 200Mi

versionUpgradeHookImage:
  image:
    name: mongodb-kubernetes-operator-version-upgrade-post-start-hook
    tag: 1.0.10
    pullPolicy: IfNotPresent


readinessProbeImage:
  image:
    name: mongodb-kubernetes-readinessprobe
    tag: 1.0.23
    pullPolicy: IfNotPresent

mongodbImage:
  image:
    name: mongodb-community-server
    tag: "8.0.10"
    pullPolicy: IfNotPresent

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
          - r7g.4xlarge
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
    - labelSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - mongodb
      topologyKey: kubernetes.io/hostname

tolerations:
- key: "dedicated"
  operator: "Equal"
  value: "mongodb"
  effect: "NoSchedule"
- effect: NoExecute
  key: node.kubernetes.io/not-ready
  operator: Exists
  tolerationSeconds: 20
- effect: NoExecute
  key: node.kubernetes.io/unreachable
  operator: Exists
  tolerationSeconds: 20

resources:
  limits:
    memory: 100Gi
  requests:
    memory: 500Mi

serviceAccount:
  create: true
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumeClaimTemplates:
  spec:
    resources:
      requests:
        storage: 1000Gi
