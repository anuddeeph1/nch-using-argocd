{{- if not .Values.global.mongo.hostedMongo }}
{{- if ( eq .Values.global.provider "openshift" ) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  creationTimestamp: null
  name: system:openshift:scc:mongodb
  namespace: {{ include "helmchart.namespace" . | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
- kind: ServiceAccount
  name: mongodb
  namespace: {{ include "helmchart.namespace" . | quote }}
{{- end }}
{{- end }}