{{- if not .Values.global.mongo.hostedMongo }}
apiVersion: "policy/v1"
kind: "PodDisruptionBudget"
metadata:
  name: "mongodb-pdb"
  namespace: {{ include "helmchart.namespace" . | quote }}
  labels: {}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: "mongodb"
    matchExpressions: []
{{- end }}
