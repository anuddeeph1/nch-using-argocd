{{- if not .Values.global.mongo.hostedMongo }}
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    email: support@mongodb.com
  labels:
    owner: mongodb
  name: mongodb-kubernetes-operator
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      name: mongodb-kubernetes-operator
  strategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      namespace: {{ include "helmchart.namespace" . | quote }}
      labels:
        name: mongodb-kubernetes-operator
        {{- range .Values.mongodbKubernetesOperator.labels }}
        {{- range $key, $value := . }}
        {{ $key }}: {{ $value }}
        {{- end }}
        {{- end }}
    spec:
      imagePullSecrets:
      - name: {{ .Values.global.imagePullSecrets.name | default "registry-secret" }}
{{- if ( gt ( int .Values.mongodbKubernetesOperator.replicas ) 1 ) }}
      affinity:
{{ toYaml .Values.mongodbKubernetesOperator.affinity | indent 8 }}   
{{- end}}  
      containers:
      - command:
        - /usr/local/bin/entrypoint
        env:
        - name: WATCH_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: OPERATOR_NAME
          value: mongodb-kubernetes-operator
        - name: AGENT_IMAGE
{{- if .Values.mongodbAgentUbi.image.tag }}
          value: "{{ .Values.global.common.registry }}/{{ .Values.mongodbAgentUbi.image.name }}:{{ .Values.mongodbAgentUbi.image.tag }}"
{{- else }}
          value: "{{ .Values.global.common.registry }}/{{ .Values.mongodbAgentUbi.image.name }}:{{ .Values.global.common.version }}"
{{- end }}
        - name: VERSION_UPGRADE_HOOK_IMAGE
{{- if .Values.versionUpgradeHookImage.image.tag }}
          value: "{{ .Values.global.common.registry }}/{{ .Values.versionUpgradeHookImage.image.name }}:{{ .Values.versionUpgradeHookImage.image.tag }}"
{{- else }}
          value: "{{ .Values.global.common.registry }}/{{ .Values.versionUpgradeHookImage.image.name }}:{{ .Values.global.common.version }}"
{{- end }}
        - name: READINESS_PROBE_IMAGE
{{- if .Values.readinessProbeImage.image.tag }}
          value: "{{ .Values.global.common.registry }}/{{ .Values.readinessProbeImage.image.name }}:{{ .Values.readinessProbeImage.image.tag }}"
{{- else }}
          value: "{{ .Values.global.common.registry }}/{{ .Values.readinessProbeImage.image.name }}:{{ .Values.global.common.version }}"
{{- end }}
        - name: MONGODB_IMAGE
          value: "{{ .Values.mongodbImage.image.name }}"
        - name: MONGODB_REPO_URL
          value: "{{ .Values.global.common.registry }}"
{{- if .Values.mongodbKubernetesOperator.image.tag }}
        image: "{{ .Values.global.common.registry }}/{{ .Values.mongodbKubernetesOperator.image.name }}:{{ .Values.mongodbKubernetesOperator.image.tag }}"
{{- else }}
        image: "{{ .Values.global.common.registry }}/{{ .Values.mongodbKubernetesOperator.image.name }}:{{ .Values.global.common.version }}"
{{- end }}
        imagePullPolicy: {{ .Values.mongodbKubernetesOperator.image.pullPolicy }}
        name: mongodb-kubernetes-operator
        resources:
{{ toYaml .Values.mongodbKubernetesOperator.resources | indent 10 }}
        securityContext:
          readOnlyRootFilesystem: true
          runAsUser: 2000
          allowPrivilegeEscalation: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: mongodb-kubernetes-operator
{{- end }}