# Default values for nirmata-services.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

postreq:
  enabled: false

prereq:
  enabled: false

base:
  enabled: false

others:
  enabled: false

# Global values that are used by shared as well as platform services
global:
  mongo:
    hostedMongo: false
    mongoDBServiceName: "mongodb-hs:27017"
    mongoDBUsername: "admin"
    mongoDBPassword: "MongoDBTest123"
    mongoDBKeystorePassword:
    mongoDBTruststorePassword:
    authdb:
  tenancyModel: "single"
  common:
    registry: 844333597536.dkr.ecr.us-west-1.amazonaws.com/nirmata
    version: "4.22.0-rc1"
    tunnelServerAddress: https://tunnel-0.tunnel:9090,https://tunnel-1.tunnel:9090
    clusterIP: "None"
    kubectlImage: kubectl:1.30

  product:
    # url: "devtest2.nirmata.co"
    url: "onprem-nch.nirmata.co"
    #product: "Enterprise"
    product: "Policy Manager Enterprise"
    productName: "PrivateEdition"
    productVersion: ""
  # Provider needs to be "openshift" in case of an openshift cluster to provide specific permissions
  provider: "eks"
  # If null, default storageclass is used, else the mentioned storageclass is used
  storageClassName: gp3
  # Specifies the specific namespace where all the resources are created
  namespaceOverride: "nch-pe"
  # env values for JVM
  env:
    JAVA_TOOL_OPTIONS:
      value: "-Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.port=9999 \
        -Dcom.sun.management.jmxremote.rmi.port=9999 -Dcom.sun.management.jmxremote.authenticate=false \
        -Dcom.sun.management.jmxremote.ssl=false"
    JAVA_OPTS:
      value: "-XshowSettings:vm -XX:MaxRAMPercentage=70.0"
  # needs to be changed if images arent used from ghcr.io/nirmata
  imagePullSecrets:
    name: amazon-ecr

# Proxy values used in Nirmata configmap
  proxy:
    HTTPS_PROXY: null
    HTTP_PROXY: null
    https_proxy: null
    http_proxy: null
    no_proxy: null
    NO_PROXY: null
  secrethelm:
    data:
      tlscrt:  
      tlskey:  

  secretMongodbUri:
    data:
      MONGODB_URI: "bW9uZ29kYjovL3BvbGljeS1zdHVkaW86TW9uZ29EQlRlc3QxMjNAbW9uZ29kYi1ocy5zdGFnaW5nOjI3MDE3L3BvbGljeS1zdHVkaW8/YXV0aFNvdXJjZT1wb2xpY3ktc3R1ZGlvJmF1dGhNZWNoYW5pc209U0NSQU0tU0hBLTI1Ngo="
  
  imageRegistry:
    server: 844333597536.dkr.ecr.us-west-1.amazonaws.com
    username: "AWS"
    password: 

  clustersvcImageRegistry:
  # set to true if you want to set these env variables in cluster service for image registry
    set: false
    name:
    username:
    password:

prereq-chart:
  policystudio:
    pvc:
      storageClass: ebs-sc-2a
      storage: 1Gi

# Default values for kafka-subchart can be overridden here 
kafka-chart:
  image:
    name: kafka
    pullPolicy: IfNotPresent
    tag: "v3-3.7.1"
  volumeClaimTemplates:
    spec:
      resources:
        requests:
          storage: 10Gi
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - namespaces: []
        labelSelector:
          matchLabels: {}
          matchExpressions:
          - key: "app"
            operator: "In"
            values:
            - "kafka"
        topologyKey: "kubernetes.io/hostname"

  controllerVolumeClaimTemplates:
    spec:
      resources:
        requests:
          storage: 5Gi
  replicaCount: 1
  resources:
    limits:
      memory: 2Gi
    requests:
      memory: 2Gi
  resourcescontroller:
    limits:
      memory: 1Gi
    requests:
      cpu: 0.5
      memory: 1Gi
  tolerations:
  - key: "node.kubernetes.io/not-ready"
    operator: "Exists"
    effect: "NoExecute"
    tolerationSeconds: 20
  - key: "node.kubernetes.io/unreachable"
    operator: "Exists"
    effect: "NoExecute"
    tolerationSeconds: 20
  - effect: NoSchedule
    key: kubernetes.aws.com/scalesetpriority
    operator: Equal
    value: spot

# Default values for mongodb-subchart can be overridden here 
mongodbchart:
  image:
    name: mongodb-community-server
    tag: "8.0.10"
    pullPolicy: IfNotPresent
  imagesidecar:
    name: mongodb-kubernetes-readinessprobe
    tag: "1.0.23"
    pullPolicy: IfNotPresent
  mongodbRepoUrl:
    name: "https://repo.mongodb.org/apt/ubuntu"
  affinity: {}
  tolerations: []

  volumeClaimTemplates:
    spec:
      resources:
        requests:
          storage: 30Gi
  replicaCount: 1
  resources:
    limits:
      memory: 10Gi
    requests:
      memory: 4Gi

nirmata-services-chart:
# These are the default values for activity service and can be configured if required during helm install or upgrade
  activity:
    env:
      JAVA_TOOL_OPTIONS:
        value: null
      JAVA_OPTS:
        value: "-XX:+UnlockExperimentalVMOptions -XX:+UseContainerSupport\
            \ -XX:MaxRAMFraction=2 -XshowSettings:vm"
    livenessProbe:
      initialDelaySeconds: 120
      timeoutSeconds: 1
      periodSeconds: 10
      successThreshold: 1
      failureThreshold: 3
      httpGet:
        path: "/activity/status"
        port: 8443
        scheme: "HTTPS"
    readinessProbe:
      initialDelaySeconds: 10
      timeoutSeconds: 1
      periodSeconds: 10
      successThreshold: 1
      failureThreshold: 3
      httpGet:
        path: "/activity/status"
        port: 8443
        scheme: "HTTPS"
    logLevel: "warn"
    replicas: 2
    resources:
      limits:
        memory: "1Gi"
      requests:
        memory: "512Mi"
    image:
      name: activity
      pullPolicy: IfNotPresent
      tag: null
    tolerations:
    - effect: NoSchedule
      key: kubernetes.aws.com/scalesetpriority
      operator: Equal
      value: spot

  clusterprocessor:
    env:
      JAVA_TOOL_OPTIONS:
        value: "-Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.port=9999 \
          -Dcom.sun.management.jmxremote.rmi.port=9999 -Dcom.sun.management.jmxremote.authenticate=false \
          -Dcom.sun.management.jmxremote.ssl=false"
      JAVA_OPTS:
        value: "-XshowSettings:vm -XX:MaxRAMPercentage=70.0 -Dnirmata.awssubscription.enable=true"
    livenessProbe:
      initialDelaySeconds: 60
      timeoutSeconds: 5
      periodSeconds: 10
      successThreshold: 1
      failureThreshold: 5
      httpGet:
        path: "/cluster/status"
        port: 8443
        scheme: "HTTPS"
    readinessProbe:
      initialDelaySeconds: 180
      timeoutSeconds: 5
      periodSeconds: 10
      successThreshold: 1
      failureThreshold: 5
      httpGet:
        path: "/cluster/status"
        port: 8443
        scheme: "HTTPS"
    logLevel: "warn"
    replicas: 2
    affinity: {}
    resources:
      limits:
        memory: "1Gi"
      requests:
        memory: "512Mi"
    image:
      name: cluster
      pullPolicy: IfNotPresent
      tag: ""

  policiesprocessor:
    env:
      JAVA_TOOL_OPTIONS:
        value: "-Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.port=9999 \
          -Dcom.sun.management.jmxremote.rmi.port=9999 -Dcom.sun.management.jmxremote.authenticate=false \
          -Dcom.sun.management.jmxremote.ssl=false"
      JAVA_OPTS:
        value: "-XX:InitialRAMPercentage=80.0 -XX:MinRAMPercentage=80.0 -XX:MaxRAMPercentage=80.0 -XshowSettings:VM -
                Dquarkus.profile=prod -Dquarkus.http.host=0.0.0.0 -Djava.util.logging.manager=org.jboss.logmanager.LogManager"
    livenessProbe:
      initialDelaySeconds: 60
      timeoutSeconds: 5
      periodSeconds: 10
      successThreshold: 1
      failureThreshold: 5
      httpGet:
        path: "/policies/status"
        port: 8443
        scheme: "HTTPS"
    readinessProbe:
      initialDelaySeconds: 60
      timeoutSeconds: 5
      periodSeconds: 10
      successThreshold: 1
      failureThreshold: 5
      httpGet:
        path: "/policies/status"
        port: 8443
        scheme: "HTTPS"
    logLevel: "warn"
    replicas: 1
    affinity: {}
    resources:
      limits:
        memory: "1Gi"
      requests:
        memory: "256Mi"
    image:
      name: policies
      tag: null
      pullPolicy: IfNotPresent
    tolerations:
    - key: "node.kubernetes.io/not-ready"
      operator: "Exists"
      effect: "NoExecute"
      tolerationSeconds: 20
    - key: "node.kubernetes.io/unreachable"
      operator: "Exists"
      effect: "NoExecute"
      tolerationSeconds: 20
    - effect: NoSchedule
      key: kubernetes.aws.com/scalesetpriority
      operator: Equal
      value: spot

