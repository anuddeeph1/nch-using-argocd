# Development-specific replica counts (minimal for dev)
mongodb-chart:
  replicaCount: 1
  resources:
    limits:
      memory: 2Gi  # Reduced from 4Gi
    requests:
      memory: 512Mi  # Reduced from 1Gi
  volumeClaimTemplates:
    spec:
      resources:
        requests:
          storage: 10Gi  # Reduced from 30Gi

kafka-chart:
  replicaCount: 1
  resources:
    limits:
      memory: 2Gi 
    requests:
      memory: 2Gi  
  volumeClaimTemplates:
    spec:
      resources:
        requests:
          storage: 5Gi  # Reduced from 10Gi

haproxy-chart:
