# Production MongoDB - 3 replicas for HA
mongodb-chart:
  replicaCount: 3
  resources:
    limits:
      memory: 8Gi  # Increased for production workload
    requests:
      memory: 4Gi  # Increased for production workload
  volumeClaimTemplates:
    spec:
      resources:
        requests:
          storage: 100Gi  # Increased for production data

# Production Kafka - 3 replicas for HA
kafka-chart:
  replicaCount: 3
  kafkaOperator:
    replicaCount: 3  # Kafka operator also 3 replicas
  resources:
    limits:
      memory: 4Gi  # Increased for production throughput
    requests:
      memory: 4Gi  
  volumeClaimTemplates:
    spec:
      resources:
        requests:
          storage: 50Gi  # Increased for production data

# Production HAProxy - 2 replicas for HA with LoadBalancer service
haproxy-chart:
  haproxy:
    replicas: 2
    logLevel: "info"  # Production logging level
    resources:
      limits:
        memory: "1Gi"  # Increased for production load
      requests:
        memory: "512Mi"
    
    # Configure HAProxy service as LoadBalancer for AWS EKS
    service:
      type: "LoadBalancer"
      externalTrafficPolicy: "Local"  # Better for source IP preservation
      annotations:
        # AWS Load Balancer Controller annotations for Application Load Balancer
        service.beta.kubernetes.io/aws-load-balancer-type: "nlb"  # Network Load Balancer
        service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"
        service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
        service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
        # Optional: Specify subnets if needed
        # service.beta.kubernetes.io/aws-load-balancer-subnets: "subnet-xxx,subnet-yyy"
        # Optional: Add tags
        service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: "Environment=production,Application=nirmata"

