# Production Environment Profile
# Use with: helm install -f values-base.yaml -f values-prod.yaml -f values-stepX-xxx.yaml

global:
  # Production namespace
  namespaceOverride: "nch-prod"
  provider: "eks"
  storageClassName: "gp3"
  tenancyModel: "single"
  
  # Production image registry configuration
  imageRegistry:
    server: "844333597536.dkr.ecr.us-west-1.amazonaws.com"
    username: ""  # Configure with registry username
    password: ""  # Configure with registry password/token
  
  # Production-specific product configuration
  product:
    url: "onprem-prod-nch-external-mongodb.nirmata.co"  # Update with your production domain
    product: "Enterprise"
    productName: "PrivateEdition"
    productVersion: "4.24.0-rc1"
    isNchOnly: true
  
  # Production environment marker
  environment: "production"
  
  # Production version aligned with current release
  common:
    version: "4.24.0-rc1"
  
  # AI configuration for LLM apps
  ai:
    bedrockInferenceProfile: "arn:aws:bedrock:us-west-2:844333597536:application-inference-profile/cpl55iltpz6n"
  
  # Production MongoDB settings (internal instance with HA)
  mongo:
    deployment:
      internal: true
      external: false
    
  # Production security settings (enhanced)
  security:
    tls:
      enabled: true  # Enable TLS for production
    networkPolicies:
      enabled: true  # Enable network policies for security
      
  # Production resource limits (higher for performance)
  resources:
    defaults:
      limits:
        memory: "2Gi"
        cpu: "1000m"
      requests:
        memory: "1Gi"
        cpu: "500m"

  # Step 5: Nirmata Configuration for Production
