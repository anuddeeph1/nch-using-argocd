# Example External Secrets Configuration
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: nch-dev1
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-west-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mongodb-credentials
  namespace: nch-dev1
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: mongodb-auth
    creationPolicy: Owner
  data:
  - secretKey: username
    remoteRef:
      key: nch/mongodb
      property: username
  - secretKey: password
    remoteRef:
      key: nch/mongodb
      property: password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: image-registry-credentials
  namespace: nch-dev1
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: image-registry
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "{{ .server }}": {
                "username": "{{ .username }}",
                "password": "{{ .password }}",
                "auth": "{{ (printf "%s:%s" .username .password) | b64enc }}"
              }
            }
          }
  data:
  - secretKey: server
    remoteRef:
      key: nch/registry
      property: server
  - secretKey: username
    remoteRef:
      key: nch/registry
      property: username
  - secretKey: password
    remoteRef:
      key: nch/registry
      property: password
