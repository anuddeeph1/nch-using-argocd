apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nch-step2-data-services-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: nch-charts
  source:
    repoURL: https://github.com/anuddeeph1/nch-using-argocd.git
    targetRevision: HEAD
    path: nch-charts
    helm:
      valueFiles:
        - ../config/values/base.yaml
        - ../config/values/environments/dev.yaml
        - ../config/values/steps/data-services.yaml
      parameters:
        - name: prereq.enabled
          value: "false"
        - name: base.enabled
          value: "true"
        - name: others.enabled
          value: "false"
        - name: postreq.enabled
          value: "false"
  destination:
    server: https://kubernetes.default.svc
    namespace: nch-dev1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 10m
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        - /spec/template/metadata/annotations
        - /spec/template/metadata/labels
        - /metadata/annotations
        - /metadata/labels
    - group: v1
      kind: PersistentVolumeClaim
      jsonPointers:
        - /spec/resources/requests/storage
    - group: v1
      kind: Secret
      jsonPointers:
        - /data
        - /metadata/annotations
        - /metadata/labels
        - /metadata/ownerReferences
    - group: v1
      kind: Secret
      name: mongodb-token-r7kff
      jsonPointers:
        - /data
        - /metadata
    - group: apps
      kind: StatefulSet
      name: kafka
      jsonPointers:
        - /spec/template/metadata/annotations
        - /spec/template/metadata/labels
        - /metadata/annotations
        - /metadata/labels
        - /status
    - group: apps
      kind: StatefulSet
      name: kafka-controller
      jsonPointers:
        - /spec/template/metadata/annotations
        - /spec/template/metadata/labels
        - /metadata/annotations
        - /metadata/labels
        - /status
