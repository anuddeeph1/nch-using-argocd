apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nch-step2-data-services-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: nch-charts
  source:
    repoURL: https://github.com/anuddeeph1/nch-using-argocd.git
    targetRevision: HEAD
    path: nch-charts
    helm:
      valueFiles:
        - ../config/values/base.yaml
        - ../config/values/environments/dev.yaml
        - ../config/values/steps/data-services.yaml
      parameters:
        - name: prereq.enabled
          value: "false"
        - name: base.enabled
          value: "true"
        - name: others.enabled
          value: "false"
        - name: postreq.enabled
          value: "false"
  destination:
    server: https://kubernetes.default.svc
    namespace: nch-dev1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 10m
  ignoreDifferences:
    # Aggressive: Ignore ALL differences for StatefulSets
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .spec
        - .status  
        - .metadata.annotations
        - .metadata.labels
        - .metadata.generation
        - .metadata.resourceVersion
    # Aggressive: Ignore ALL differences for Secrets
    - group: v1
      kind: Secret
      jqPathExpressions:
        - .data
        - .metadata
        - .type
    # Ignore PVC differences
    - group: v1
      kind: PersistentVolumeClaim
      jsonPointers:
        - /spec/resources/requests/storage
        - /metadata/annotations
        - /metadata/labels
    # Specifically ignore the problematic mongodb token
    - group: v1
      kind: Secret
      name: mongodb-token-r7kff
    # Ignore all service account tokens
    - group: v1
      kind: Secret
      jqPathExpressions:
        - 'select(.type == "kubernetes.io/service-account-token")'
