apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nch-step4-load-balancer-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: nch-charts
  source:
    repoURL: https://github.com/anuddeeph1/nch-using-argocd.git
    targetRevision: HEAD
    path: nch-charts
    helm:
      valueFiles:
        - ../config/values/base.yaml
        - ../config/values/environments/prod.yaml
        - ../config/values/steps/load-balancer.yaml
      parameters:
        - name: prereq.enabled
          value: "false"
        - name: base.enabled
          value: "false"
        - name: others.enabled
          value: "false"
        - name: postreq.enabled
          value: "true"
  destination:
    server: https://kubernetes.default.svc
    namespace: nch-pe
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 5m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/metadata/annotations/deployment.kubernetes.io~1revision
