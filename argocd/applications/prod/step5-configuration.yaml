apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nch-step5-configuration-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/hook: PostSync
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: nch-charts
  source:
    repoURL: https://github.com/anuddeeph1/nch-using-argocd.git
    targetRevision: HEAD
    path: nch-charts
    helm:
      valueFiles:
        - ../config/values/base.yaml
        - ../config/values/environments/prod.yaml
        - ../config/values/steps/configuration.yaml
      parameters:
        - name: prereq.enabled
          value: "false"
        - name: base.enabled
          value: "false"
        - name: others.enabled
          value: "false"
        - name: postreq.enabled
          value: "false"
        - name: configuration.enabled
          value: "true"
  destination:
    server: https://kubernetes.default.svc
    namespace: nch-pe
  syncPolicy:
    # Manual sync for configuration step due to API calls
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
