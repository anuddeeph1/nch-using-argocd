apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nch-charts-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: RespectIgnoreDifferences=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/anuddeeph1/nch-using-argocd.git
    targetRevision: HEAD
    path: nch-charts
    helm:
      valueFiles:
        - ../config/values/base.yaml
        - ../config/values/environments/dev.yaml
      parameters:
        # Enable all components
        - name: prereq.enabled
          value: "true"
        - name: base.enabled
          value: "true"
        - name: others.enabled
          value: "true"
        - name: postreq.enabled
          value: "true"
        - name: configuration.enabled
          value: "true"
        - name: nirmata-services-chart.users.enabled
          value: "true"
        - name: nirmata-services-chart.security.enabled
          value: "true"
  destination:
    server: https://kubernetes.default.svc
    namespace: nch-dev1
  syncPolicy:
    # Remove automated sync to troubleshoot
    # automated:
    #   prune: true
    #   selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
      - SkipDryRunOnMissingResource=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  ignoreDifferences:
    # Aggressive: Ignore ALL differences for Secrets (like step2)
    - group: v1
      kind: Secret
      jqPathExpressions:
        - .data
        - .metadata
        - .type
    # Ignore service account tokens
    - group: v1
      kind: Secret
      jqPathExpressions:
        - 'select(.type == "kubernetes.io/service-account-token")'
    # Ignore all mongodb-related tokens
    - group: v1
      kind: Secret
      jqPathExpressions:
        - 'select(.metadata.name | test("mongodb-token-.*"))'
    # Completely ignore the problematic MongoDB token with all possible patterns
    - group: v1
      kind: Secret
      name: mongodb-token-r7kff
      jqPathExpressions:
        - .
    - group: v1
      kind: Secret
      name: mongodb-token-r7kff
      jsonPointers:
        - /
        - /data
        - /metadata
        - /type
    # Aggressive: Ignore ALL differences for StatefulSets (like step2)
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .spec
        - .status  
        - .metadata.annotations
        - .metadata.labels
        - .metadata.generation
        - .metadata.resourceVersion
    # Ignore PVC storage requests
    - group: v1
      kind: PersistentVolumeClaim
      jsonPointers:
        - /spec/resources/requests/storage
        - /status
