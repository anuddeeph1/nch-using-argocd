apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nch-charts-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/anuddeeph1/nch-using-argocd.git
    targetRevision: HEAD
    path: nch-charts
    helm:
      valueFiles:
        - ../config/values/base.yaml
        - ../config/values/environments/dev.yaml
      parameters:
        # Enable all components
        - name: prereq.enabled
          value: "true"
        - name: base.enabled
          value: "true"
        - name: others.enabled
          value: "true"
        - name: postreq.enabled
          value: "true"
        - name: configuration.enabled
          value: "true"
  destination:
    server: https://kubernetes.default.svc
    namespace: nch-dev1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  ignoreDifferences:
    # Ignore service account tokens
    - group: v1
      kind: Secret
      jqPathExpressions:
        - 'select(.type == "kubernetes.io/service-account-token")'
    # Ignore StatefulSet status and volatile fields
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /status
        - /metadata/generation
        - /metadata/resourceVersion
    # Ignore PVC storage requests
    - group: v1
      kind: PersistentVolumeClaim
      jsonPointers:
        - /spec/resources/requests/storage
