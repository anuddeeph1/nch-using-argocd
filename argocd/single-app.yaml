apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nch-charts-complete
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/nch-charts  # Replace with your repo URL
    targetRevision: HEAD
    path: nch-charts
    helm:
      valueFiles:
        - ../config/values/base.yaml
        - ../config/values/environments/dev.yaml  # Change to prod.yaml for production
      parameters:
        - name: prereq.enabled
          value: "true"
        - name: base.enabled
          value: "true"
        - name: others.enabled
          value: "true"
        - name: postreq.enabled
          value: "true"
  destination:
    server: https://kubernetes.default.svc
    namespace: nch-dev1  # Change to nch-pe for production
  syncPolicy:
    # Manual sync recommended for initial deployment
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 10m
  ignoreDifferences:
    - group: v1
      kind: Secret
      jsonPointers:
        - /data
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/metadata/annotations/deployment.kubernetes.io~1revision
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates/0/spec/resources/requests/storage
