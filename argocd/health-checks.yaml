# Custom Health Checks for NCH Components
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
data:
  # Custom health check for MongoDB
  resource.customizations.health.mongodbcommunity.mongodb.com_MongoDBCommunity: |
    hs = {}
    if obj.status ~= nil then
      if obj.status.phase == "Running" then
        hs.status = "Healthy"
        hs.message = "MongoDB is running"
      else
        hs.status = "Progressing"
        hs.message = "MongoDB is " .. obj.status.phase
      end
    else
      hs.status = "Progressing"
      hs.message = "MongoDB status unknown"
    end
    return hs

  # Custom health check for Kafka StatefulSet
  resource.customizations.health.apps_StatefulSet: |
    hs = {}
    if obj.status ~= nil then
      if obj.status.readyReplicas ~= nil and obj.status.readyReplicas == obj.spec.replicas then
        hs.status = "Healthy"
        hs.message = "StatefulSet is ready"
      else
        hs.status = "Progressing"
        hs.message = "StatefulSet is not ready"
      end
    else
      hs.status = "Progressing"
      hs.message = "StatefulSet status unknown"
    end
    return hs

  # Ignore differences for frequently changing annotations
  resource.ignoreDifferences: |
    jsonPointers:
    - /metadata/annotations/deployment.kubernetes.io~1revision
    - /spec/template/metadata/annotations/deployment.kubernetes.io~1revision
